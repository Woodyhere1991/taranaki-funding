<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Share Taranaki Funding</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;color:#222;background:#f4f7f5}
header{background:#1f5f4a;color:#fff;padding:36px 20px;text-align:center}
header h1{margin:0 0 8px;font-size:28px}
header p{margin:0 auto;max-width:520px;font-size:17px;line-height:1.45}
main{max-width:560px;margin:0 auto;padding:20px}
.card{background:#fff;border-radius:10px;padding:20px;box-shadow:0 1px 4px rgba(0,0,0,.08);margin-bottom:18px}
label{display:block;font-size:14px;margin:0 0 6px;font-weight:bold}
input[type=text]{width:100%;padding:12px;font-size:16px;border:1px solid #bbb;border-radius:6px}
button{width:100%;min-height:44px;padding:14px;font-size:17px;background:#c4561f;color:#fff;border:0;border-radius:6px;font-weight:bold;cursor:pointer}
button.secondary{background:#1f5f4a;margin-top:10px}
.fallback{margin-top:16px}
a.action{display:flex;align-items:center;justify-content:center;width:100%;min-height:44px;margin-top:10px;padding:12px 16px;background:#1f5f4a;color:#fff;text-decoration:none;border-radius:6px;font-weight:bold;font-size:17px}
a.action[hidden]{display:none}
.back{text-align:center;font-size:15px}
.back a{color:#1f5f4a}
</style>
</head>
<body>
<header>
<h1 id="heading">Share Taranaki Funding</h1>
<p>Know a club treasurer, secretary or committee member? Send them the free Monday funding email.</p>
</header>
<main>
<div class="card">
<button type="button" id="share-btn">Share</button>
<div class="fallback" id="fallback">
<label for="share-url">Link</label>
<input id="share-url" type="text" readonly value="https://woodyhere1991.github.io/taranaki-funding/">
<button type="button" class="secondary" id="copy-btn">Copy link</button>
<a class="action" id="facebook" href="https://www.facebook.com/sharer/sharer.php?u=https%3A%2F%2Fwoodyhere1991.github.io%2Ftaranaki-funding%2F" target="_blank" rel="noopener">Share on Facebook</a>
<a class="action" id="messenger" href="fb-messenger://share/?link=https%3A%2F%2Fwoodyhere1991.github.io%2Ftaranaki-funding%2F" hidden>Send in Messenger</a>
<a class="action" id="email" href="mailto:?subject=Taranaki%20Funding%3A%20free%20grant%20deadline%20email&amp;body=Free%20weekly%20email%20listing%20Taranaki%20grant%20deadlines%20for%20clubs%2C%20schools%2C%20marae%20and%20community%20groups.%0A%0Ahttps%3A%2F%2Fwoodyhere1991.github.io%2Ftaranaki-funding%2F">Email it</a>
</div>
</div>
<p class="back"><a id="signup" href="https://woodyhere1991.github.io/taranaki-funding/">Taranaki Funding signup</a></p>
</main>
<script>
(function () {
  var regions = {
    taranaki: {
      brand: "Taranaki Funding",
      name: "Taranaki",
      url: "https://woodyhere1991.github.io/taranaki-funding/"
    },
    whanganui: {
      brand: "Whanganui Funding",
      name: "Whanganui",
      url: "https://woodyhere1991.github.io/taranaki-funding/whanganui/"
    },
    manawatu: {
      brand: "Manawatū Funding",
      name: "Manawatū",
      url: "https://woodyhere1991.github.io/taranaki-funding/manawatu/"
    }
  };

  var param = new URLSearchParams(window.location.search).get("r");
  var key = (param || "").toLowerCase();
  var region = regions[key] || regions.taranaki;
  var text = "Free weekly email listing " + region.name + " grant deadlines for clubs, schools, marae and community groups.";

  document.title = "Share " + region.brand;
  document.getElementById("heading").textContent = "Share " + region.brand;

  var urlInput = document.getElementById("share-url");
  urlInput.value = region.url;
  urlInput.addEventListener("focus", function () {
    this.select();
  });

  document.getElementById("facebook").href = "https://www.facebook.com/sharer/sharer.php?u=" + encodeURIComponent(region.url);
  var messenger = document.getElementById("messenger");
  messenger.href = "fb-messenger://share/?link=" + encodeURIComponent(region.url);
  if (/Android|iPhone|iPad/.test(navigator.userAgent)) messenger.hidden = false;

  document.getElementById("email").href = "mailto:?subject=" + encodeURIComponent(region.brand + ": free grant deadline email") + "&body=" + encodeURIComponent(text + "\n\n" + region.url);

  var signup = document.getElementById("signup");
  signup.href = region.url;
  signup.textContent = region.brand + " signup";

  var fallback = document.getElementById("fallback");
  function showFallback() {
    fallback.hidden = false;
  }

  var copyBtn = document.getElementById("copy-btn");
  var copyTimer = 0;
  function markCopied() {
    copyBtn.textContent = "Copied";
    window.clearTimeout(copyTimer);
    copyTimer = window.setTimeout(function () {
      copyBtn.textContent = "Copy link";
    }, 2000);
  }
  function legacyCopy() {
    urlInput.focus();
    urlInput.select();
    try {
      return document.execCommand("copy");
    } catch (err) {
      return false;
    }
  }
  copyBtn.addEventListener("click", function () {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(region.url).then(markCopied).catch(function () {
        if (legacyCopy()) markCopied();
      });
      return;
    }
    if (legacyCopy()) markCopied();
  });

  document.getElementById("share-btn").addEventListener("click", function () {
    if (typeof navigator.share !== "function") {
      showFallback();
      return;
    }
    navigator.share({ title: region.brand, text: text, url: region.url }).catch(function (err) {
      if (err && err.name === "AbortError") return;
      showFallback();
    });
  });
})();
</script>
</body>
</html>
